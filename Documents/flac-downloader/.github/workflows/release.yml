name: Build & Release

on:
  push:
    tags:
      - "v*"          # triggers on any tag like v1.0.0, v1.2.3, etc.

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Fetch ffmpeg
        run: |
          New-Item -ItemType Directory -Force ffmpeg
          Invoke-WebRequest -Uri https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          Get-ChildItem -Path ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1 | Copy-Item -Destination ffmpeg\ffmpeg.exe
          Remove-Item -Recurse -Force ffmpeg-tmp

      # PLAYWRIGHT_BROWSERS_PATH=0 installs Chromium INSIDE the playwright
      # package so --collect-all picks it up; the app sets the same variable at
      # runtime when frozen. Without this the browser-grab and site sign-in
      # fallbacks are dead in the shipped exe.
      - name: Install Playwright Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: |
          python -m playwright install chromium

      # Same treatment as ffmpeg: a 168 MB binary fetched rather than committed,
      # then bundled with --add-data. photo._seed_model copies it out of the exe
      # into %LOCALAPPDATA% and points $U2NET_HOME at it, so the shipped app
      # never downloads a model at runtime. The size check catches a truncated
      # download here rather than in a user's hands.
      - name: Fetch the background-removal model
        run: |
          New-Item -ItemType Directory -Force assets\models
          Invoke-WebRequest -Uri https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2net.onnx -OutFile assets\models\u2net.onnx
          $mb = [math]::Round((Get-Item "assets\models\u2net.onnx").Length / 1MB)
          Write-Output "u2net.onnx: $mb MB"
          if ($mb -lt 150) { throw "u2net.onnx is only $mb MB -- truncated download." }

      - name: Generate icon
        run: python make_icon.py

      # Keep these flags in sync with build.bat. curl_cffi provides the TLS
      # impersonation that gets past HTTP 410 fingerprint blocks, and playwright
      # carries the bundled browser; dropping either produces an exe that looks
      # fine until it silently fails on the sites those exist for.
      #
      # --collect-all PIL was previously missing here while build.bat had it, so
      # the exe tested locally was not built from the same list as the one this
      # workflow publishes. Added rather than removed: dropping it is the change
      # that can only be validated by a full release build.
      #
      # The rembg block is the Photo tab. onnxruntime matters most — its
      # inference DLLs live in onnxruntime\capi where PyInstaller's static
      # analysis does not find them. numba and llvmlite arrive via pymatting,
      # which rembg imports at module scope even when alpha matting is off.
      # skimage is declared by rembg but imported nowhere in it (verified), and
      # excluding it also drops imageio, tifffile and networkx.
      - name: Build exe
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: |
          pyinstaller `
            --noconfirm `
            --onedir `
            --windowed `
            --name "Swiss Downloader" `
            --add-data "ui;ui" `
            --add-data "assets\models;assets\models" `
            --add-binary "ffmpeg\ffmpeg.exe;ffmpeg" `
            --collect-all pywebview `
            --collect-all mutagen `
            --collect-all curl_cffi `
            --collect-all playwright `
            --collect-all PIL `
            --collect-all rembg `
            --collect-all onnxruntime `
            --collect-all numpy `
            --collect-all cv2 `
            --collect-all scipy `
            --collect-all pymatting `
            --collect-all numba `
            --collect-all llvmlite `
            --collect-all pooch `
            --exclude-module skimage `
            --exclude-module matplotlib `
            --icon icon.ico `
            app.py

      # --onedir means the artifact is a FOLDER, so size is measured across the
      # whole tree rather than on one file.
      - name: Verify the build produced an app folder
        run: |
          if (-not (Test-Path "dist\Swiss Downloader\Swiss Downloader.exe")) {
            throw "Build produced no exe -- refusing to publish a release."
          }
          $mb = [math]::Round(((Get-ChildItem "dist\Swiss Downloader" -Recurse -File |
                                Measure-Object -Property Length -Sum).Sum / 1MB))
          Write-Output "Built app folder: $mb MB"
          # A build missing the bundled Chromium or the cutout model still
          # succeeds but comes out a few hundred MB lighter, which is the cheap
          # signal that one of the --collect-all flags silently stopped working.
          if ($mb -lt 900) {
            throw "App folder is only $mb MB -- the browser or the cutout model is probably missing."
          }
          # The model is a plain file on disk under --onedir, so assert it
          # directly instead of inferring it from the total.
          $model = "dist\Swiss Downloader\_internal\assets\models\u2net.onnx"
          if (-not (Test-Path $model)) {
            throw "u2net.onnx is not in the bundle -- --add-data did not take."
          }
          Write-Output "model: $([math]::Round((Get-Item $model).Length / 1MB)) MB"

      # Size is a proxy; this actually runs the thing. --selftest exercises the
      # three failures --collect-all breaks silently and a size check cannot see:
      # rembg absent, onnxruntime's native DLLs absent, and the .onnx not landing
      # where _MEIPASS puts it. Catching those here beats catching them in a
      # user's hands, which is the only other place they show up.
      - name: Self-test the frozen exe
        run: |
          $p = Start-Process -FilePath "dist\Swiss Downloader\Swiss Downloader.exe" `
                             -ArgumentList "--selftest" -PassThru -Wait
          # utils.app_data_dir() is platformdirs.user_data_dir("flac-downloader"),
          # whose second positional is appauthor — so on Windows the name appears
          # TWICE: %LOCALAPPDATA%\flac-downloader\flac-downloader. Long-standing
          # behaviour and not worth changing (every user's history and settings
          # live there), but the path has to be written correctly here or this
          # step silently prints nothing. Globbed rather than hardcoded so it
          # survives if that ever is changed.
          $log = Get-ChildItem -Path $env:LOCALAPPDATA -Recurse -Filter "selftest.txt" `
                               -ErrorAction SilentlyContinue | Select-Object -First 1
          # -Encoding utf8 because app.py writes the report as UTF-8 and
          # Get-Content otherwise decodes it as ANSI, turning every em-dash into
          # mojibake in the CI log.
          if ($log) { Write-Output "--- $($log.FullName) ---"; Get-Content $log.FullName -Encoding utf8 }
          else { Write-Output "(no selftest.txt found)" }
          if ($p.ExitCode -ne 0) {
            throw "Self-test failed with exit code $($p.ExitCode) -- see the log above."
          }

      # --onedir ships a folder, and a GitHub release asset is a single file. An
      # Inno Setup installer is that single file — and unlike a zip it is a .exe,
      # which is what updater.py's asset scan looks for, and it can replace files
      # the running app has locked. See installer.iss.
      #
      # Inno Setup 6 is preinstalled on windows-latest, so no install step.
      - name: Build the installer
        run: |
          $ver = (Select-String -Path version.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          Write-Output "version.py says: $ver"
          $tag = "${{ github.ref_name }}" -replace '^v',''
          # A tag that disagrees with version.py means the app would report one
          # version while the updater compares another. Fail loudly.
          if ($ver -ne $tag) { throw "tag v$tag does not match version.py ($ver)" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$ver installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          $setup = "dist\Swiss-Downloader-v$ver-Setup.exe"
          if (-not (Test-Path $setup)) { throw "no installer produced" }
          Write-Output "installer: $([math]::Round((Get-Item $setup).Length/1MB)) MB"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Swiss-Downloader-v*-Setup.exe
          # The release body becomes the changelog shown in-app.
          # Edit it on the GitHub Releases page after the tag is pushed.
